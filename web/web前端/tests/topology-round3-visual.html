<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFELINE 第三轮视觉回归</title>
<style>
body{margin:0;background:#f4f0e7;color:#39352c;font:16px/1.65 system-ui,sans-serif}main{max-width:1180px;margin:20px auto;padding:0 18px}h1{font-size:24px}button{padding:9px 15px;margin:4px;border:1px solid #c7bda8;border-radius:12px;background:#fffdf7;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#dae5ff}#status{min-height:28px}.views{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}.frame{height:620px;position:relative;border:1px solid #d6cebc;border-radius:18px;overflow:hidden;background:#f4f0e7}#surface{align-self:center}#description{max-width:1000px}@media(max-width:800px){.views{display:block}.frame{height:480px}#surface{margin-top:16px}}

<h1>LIFELINE · 第三轮视觉回归</h1>
