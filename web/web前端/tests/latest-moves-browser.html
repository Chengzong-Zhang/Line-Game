<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latest move Canvas regression</title>
<style>body{margin:0;background:#f6f1e8;font:16px sans-serif}#frame{position:relative;width:100%;height:80vh}button{padding:12px;margin:4px}</style>
<div id="frame"><canvas id="board"></canvas></div><button id="pass">跳过</button><button id="undo">撤回最后一步</button><button id="reset">重新开始</button>
<script type="module">
import GameController from '../GameController.js?v=20261025-terminal-v4';
import { randomInitialPositions } from '../StartingPoints.js?v=20261025-terminal-v4';
const playerCount = Number(new URL(location.href).searchParams.get('players')) || 3;
const settings = { gridSize: playerCount > 6 ? 9 : 7, playerCount, rulesVersion: 'territory-v3', boardShape: playerCount > 3 ? 'hexagon' : 'triangle' };
if (playerCount > 6) settings.initialPositions = randomInitialPositions(settings.gridSize, playerCount, () => .41, settings.boardShape);
let actions = [];
const controller = new GameController(document.querySelector('canvas'), { engine: settings,
  onActionFeedback(action) { if (action.success) actions.push(action.type === 'move'
    ? { type: 'player_move', point: action.point } : { type: 'player_skip' }); } });
controller.init();
document.querySelector('#pass').onclick = () => controller.skipTurn();
document.querySelector('#undo').onclick = () => { actions = actions.slice(0, -1); controller.restoreMatchState({ settings, actions }); };
document.querySelector('#reset').onclick = () => { actions = []; controller.resetGame({ force: true }); };
window.fixture = { controller, settings, get actions() { return actions; } };
</script></html>
