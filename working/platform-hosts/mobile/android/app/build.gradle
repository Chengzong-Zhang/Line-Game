apply plugin: 'com.android.application'

def localReleaseSigning = [:]
def localReleaseSigningFile = rootProject.file('../local_artifacts/release-signing/android-signing.json')
if (localReleaseSigningFile.isFile()) {
    try {
        localReleaseSigning = new groovy.json.JsonSlurper().parse(localReleaseSigningFile)
    } catch (Exception ignored) {
        localReleaseSigning = [:]
    }
}
def releaseSigningValue = { String envName, String propertyName ->
    def envValue = System.getenv(envName)
    def localValue = localReleaseSigning[propertyName]
    return envValue != null && !envValue.trim().isEmpty() ? envValue : localValue
}
def releaseStoreFile = releaseSigningValue('LIFELINE_ANDROID_STORE_FILE', 'storeFile')
def releaseStorePassword = releaseSigningValue('LIFELINE_ANDROID_STORE_PASSWORD', 'storePassword')
def releaseKeyAlias = releaseSigningValue('LIFELINE_ANDROID_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = releaseSigningValue('LIFELINE_ANDROID_KEY_PASSWORD', 'keyPassword')
def releaseStoreAbsolute = releaseStoreFile != null && new File(releaseStoreFile.toString()).isAbsolute()
def releaseStoreExists = releaseStoreAbsolute && new File(releaseStoreFile.toString()).isFile()
def releaseSigningReady = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.toString().trim().isEmpty() } && releaseStoreExists

android {
    namespace = "cn.lifelinegame.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "cn.lifelinegame.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.configureEach { task ->
    if (task.name.toLowerCase(Locale.ROOT).matches('.*(assemble|bundle|package).*release.*') && !releaseSigningReady) {
        task.doFirst {
            throw new GradleException('Release signing is BLOCKED: provide Android signing inputs and an absolute keystore path through LIFELINE_ANDROID_* environment variables or mobile/local_artifacts/release-signing/android-signing.json.')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
